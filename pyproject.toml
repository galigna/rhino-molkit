[project]
name = "rhino-molkit"
version = "0.0.0"
description = "Rhino 8 plugin that generates 3D-printable molecular puzzles."
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "PT", "RUF", "ANN"]
ignore = ["SIM300"]  # "Yoda" check misfires on UPPER_CASE test constants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
