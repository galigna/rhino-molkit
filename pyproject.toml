[project]
name = "rhino-molkit"
version = "0.0.0"
description = "Rhino 8 plugin that generates 3D-printable molecular puzzles."
requires-python = ">=3.9"
# Pinned to the newest releases with cp39 wheels: Rhino 8 runs CPython 3.9.
dependencies = ["rdkit==2025.9.2", "gemmi==0.7.5"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "PT", "RUF", "ANN"]
ignore = ["SIM300"]  # "Yoda" check misfires on UPPER_CASE test constants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src/molkit/core"]
mypy_path = "src"
# rdkit 2025.9.2 ships stubs with a syntax error; core only imports rdkit/gemmi, typed as Any.
no_site_packages = true

[[tool.mypy.overrides]]
module = ["rdkit", "rdkit.*", "gemmi", "gemmi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
